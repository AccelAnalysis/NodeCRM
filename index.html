<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#161d27">
  <meta name="description" content="NodeCRM is a calm communications plane. Stages across, personas down, a node where they meet.">
  <title>NodeCRM</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/plane.css">
  <link rel="stylesheet" href="css/avatars.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/wizard.css">
  <link rel="stylesheet" href="css/comms.css">
  <link rel="stylesheet" href="css/channels.css">
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-glass">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-copy">
            <h1 class="brand-name">NodeCRM</h1>
            <p class="brand-sub" id="market-label">No market yet</p>
          </div>
        </div>
        <div class="toolbar-actions" role="toolbar" aria-label="Workspace">
          <span class="save-pill" id="save-pill" hidden title="Saved in this browser">Saved</span>
          <button type="button" class="btn btn-plain" data-action="sample">Sample market</button>
          <button type="button" class="btn btn-tinted" data-action="open-wizard" id="btn-personas" hidden>Edit market</button>
          <button type="button" class="btn btn-plain" data-action="reset">Reset</button>
        </div>
      </div>
    </header>
    <main class="plane" aria-label="Communications plane">
      <div class="plane-scroll" id="plane-scroll">
        <div class="grid" id="grid"></div>
      </div>
    </main>
  </div>
  <div id="stage-popover" class="popover" role="dialog" aria-label="Add a stage" hidden></div>
  <div id="wizard" class="overlay" data-testid="wizard" hidden></div>
  <div id="comms" data-testid="comms" hidden></div>
  <section id="channel-map" class="channel-map" data-testid="channel-map" hidden></section>
  <div id="confirm" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">NodeCRM needs JavaScript. It still runs entirely in this browser.</p></noscript>
  <script src="js/util.js"></script>
  <script src="js/registry.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/model.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/personas.js"></script>
  <script src="js/nodes.js"></script>
  <script src="js/plane.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/wizard.js"></script>
  <script src="js/comms.js"></script>
  <script src="js/channels.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
